<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>서준 서진이를 위한 마리오 게임</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="game-frame" aria-label="서준 서진이를 위한 마리오 게임">
        <div class="canvas-wrap">
          <canvas id="game-canvas" width="960" height="540" aria-label="자동 달리기 점프 게임"></canvas>

          <div class="hud-row">
            <div class="pill cloud-pill" id="time-pill">남은 시간 3:00</div>
            <div class="hud-actions">
              <button class="icon-button cloud-button" id="sound-toggle" type="button" aria-pressed="false">소리 켜짐</button>
              <button class="icon-button cloud-button" id="fullscreen-button" type="button">전체 화면</button>
              <button class="icon-button cloud-button" id="restart-button" type="button">처음부터</button>
            </div>
          </div>

          <div class="overlay" id="overlay">
            <div class="overlay-card">
              <div class="mini-badge cloud-badge" id="overlay-badge">서준 서진이 전용</div>
              <h1 class="cloud-title" id="overlay-title">서준 서진이를 위한 마리오 게임</h1>
              <p class="cloud-copy" id="overlay-text">점프로 폴짝, 발사로 팡팡. 구덩이와 몬스터를 넘어 2분 동안 달려요.</p>
              <div class="overlay-kids" id="overlay-kids">
                <figure class="kid-card">
                  <img src="./assets/seojun.png" alt="서준이" id="seojun-image" />
                  <figcaption>서준이</figcaption>
                </figure>
                <figure class="kid-card">
                  <img src="./assets/seojin.png" alt="서진이" id="seojin-image" />
                  <figcaption>서진이</figcaption>
                </figure>
              </div>
              <div class="hint-grid">
                <div class="hint-card">
                  <span class="hint-icon">☁</span>
                  <span>점프 버튼으로 폴짝</span>
                </div>
                <div class="hint-card">
                  <span class="hint-icon">★</span>
                  <span>발사 버튼으로 팡</span>
                </div>
              </div>
              <button class="primary-button" id="start-btn" type="button">시작하기</button>
            </div>
          </div>

          <div class="game-controls" aria-label="게임 조작 버튼">
            <button class="control-button jump-button" id="jump-button" type="button">점프</button>
            <button class="control-button shoot-button" id="shoot-button" type="button">발사</button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
